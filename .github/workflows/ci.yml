name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Ruff lint
        run: |
          ruff check \
            superset-ai-assistant-mcp/backend \
            superset-ai-assistant-mcp/frontend \
            superset-ai-assistant-mcp/tests \
            superset-mcp/main.py

      - name: Python compile check
        run: |
          python -m compileall \
            superset-ai-assistant-mcp/backend \
            superset-ai-assistant-mcp/frontend \
            superset-ai-assistant-mcp/tests \
            superset-mcp/main.py

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r superset-ai-assistant-mcp/requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: ./superset-ai-assistant-mcp
        run: |
          python -m unittest discover -s superset-ai-assistant-mcp/tests -p "test_*.py"
